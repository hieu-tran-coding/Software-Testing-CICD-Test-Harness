name: "CI Pipeline - Build & Automated Tests"

on:
  push:
    branches:
      - main
      - master
      - docs-and-reports
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - docs-and-reports

jobs:
  build-and-test:
    name: "Build, Lint & Automated Test Harness"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install Dependencies"
        run: npm install

      - name: "Run Task C-1 - Jest Unit Tests (Coverage >= 80%)"
        run: npm run test:unit

      - name: "Run Task C-2 - SuperTest API Integration Tests"
        run: npm run test:api

      - name: "Run Full Test Suite with CI Reporters"
        if: always()
        run: npm run test:ci

      - name: "Upload Coverage Report Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

      - name: "Upload JUnit Test Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: junit.xml
          retention-days: 14
