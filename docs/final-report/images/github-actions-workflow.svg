<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị thực thi GitHub Actions của đề tài</title>
  <desc id="desc">Mười một job của CI Pipeline và workflow CodeQL độc lập.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:15px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .head{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.body{font:14px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .event{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.setup{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .test{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.security{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .package{fill:#faf5ff;stroke:#a855f7;stroke-width:2}.report{fill:#fefce8;stroke:#ca8a04;stroke-width:2}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="860" fill="#f8fafc"/>
  <text x="750" y="42" text-anchor="middle" class="title">GitHub Actions — Đồ thị thực thi của đề tài</text>
  <text x="750" y="68" text-anchor="middle" class="subtitle">CI Pipeline gồm 11 job; CodeQL chạy bằng workflow độc lập</text>

  <g filter="url(#shadow)"><rect x="565" y="95" width="370" height="70" rx="16" class="event"/><text x="750" y="124" text-anchor="middle" class="head">Sự kiện kích hoạt</text><text x="750" y="148" text-anchor="middle" class="body">push · pull_request · workflow_dispatch</text></g>

  <g filter="url(#shadow)"><rect x="85" y="220" width="200" height="74" rx="14" class="setup"/><text x="185" y="250" text-anchor="middle" class="head">1. Checkout</text><text x="185" y="273" text-anchor="middle" class="body">Mã nguồn + submodule</text></g>
  <g filter="url(#shadow)"><rect x="335" y="220" width="200" height="74" rx="14" class="setup"/><text x="435" y="250" text-anchor="middle" class="head">2. Setup Node.js</text><text x="435" y="273" text-anchor="middle" class="body">Node 14.21.3</text></g>
  <g filter="url(#shadow)"><rect x="585" y="220" width="200" height="74" rx="14" class="setup"/><text x="685" y="250" text-anchor="middle" class="head">3. Install</text><text x="685" y="273" text-anchor="middle" class="body">Dependency + cache</text></g>

  <g filter="url(#shadow)"><rect x="200" y="365" width="200" height="78" rx="14" class="test"/><text x="300" y="396" text-anchor="middle" class="head">4. Lint</text><text x="300" y="420" text-anchor="middle" class="body">ESLint</text></g>
  <g filter="url(#shadow)"><rect x="465" y="365" width="220" height="78" rx="14" class="test"/><text x="575" y="396" text-anchor="middle" class="head">5. Unit Tests</text><text x="575" y="420" text-anchor="middle" class="body">Mocha · Jest · Coverage</text></g>
  <g filter="url(#shadow)"><rect x="750" y="365" width="220" height="78" rx="14" class="security"/><text x="860" y="396" text-anchor="middle" class="head">7. Security Scan</text><text x="860" y="420" text-anchor="middle" class="body">npm audit High/Critical</text></g>
  <g filter="url(#shadow)"><rect x="465" y="505" width="220" height="78" rx="14" class="test"/><text x="575" y="536" text-anchor="middle" class="head">6. API Tests</text><text x="575" y="560" text-anchor="middle" class="body">Newman · SuperTest</text></g>

  <g filter="url(#shadow)"><rect x="830" y="505" width="230" height="78" rx="14" class="report"/><text x="945" y="536" text-anchor="middle" class="head">11. Allure Report</text><text x="945" y="560" text-anchor="middle" class="body">Unit/API report artifact</text></g>

  <g filter="url(#shadow)"><rect x="465" y="650" width="220" height="78" rx="14" class="package"/><text x="575" y="681" text-anchor="middle" class="head">8. Docker Build</text><text x="575" y="705" text-anchor="middle" class="body">Build · container smoke</text></g>
  <g filter="url(#shadow)"><rect x="750" y="650" width="220" height="78" rx="14" class="package"/><text x="860" y="681" text-anchor="middle" class="head">9. Docker Push</text><text x="860" y="705" text-anchor="middle" class="body">GHCR · full Git SHA</text></g>
  <g filter="url(#shadow)"><rect x="1035" y="650" width="230" height="78" rx="14" class="package"/><text x="1150" y="681" text-anchor="middle" class="head">10. Trigger Jenkins</text><text x="1150" y="705" text-anchor="middle" class="body">Bàn giao image + SHA</text></g>

  <g filter="url(#shadow)"><rect x="1110" y="220" width="290" height="223" rx="18" class="security"/><text x="1255" y="252" text-anchor="middle" class="head">CodeQL SAST Analysis</text><text x="1255" y="281" text-anchor="middle" class="body">Workflow độc lập</text><text x="1255" y="313" text-anchor="middle" class="body">JavaScript / TypeScript</text><text x="1255" y="340" text-anchor="middle" class="body">security-extended</text><text x="1255" y="365" text-anchor="middle" class="body">security-and-quality</text><text x="1255" y="405" text-anchor="middle" class="subtitle">push · PR · lịch tuần · thủ công</text></g>

  <path d="M750 165 V190 H185 V220" class="line"/><path d="M285 257 H335" class="line"/><path d="M535 257 H585" class="line"/>
  <path d="M685 294 V325 H300 V365" class="line"/><path d="M685 294 V325 H575 V365" class="line"/><path d="M685 294 V325 H860 V365" class="line"/>
  <path d="M575 443 V505" class="line"/>
  <path d="M300 443 V620 H500 V650" class="line"/><path d="M575 583 V650" class="line"/><path d="M860 443 V620 H650 V650" class="line"/>
  <path d="M685 404 H760 V475 H945 V505" class="dash"/><path d="M685 544 H830" class="dash"/>
  <path d="M685 689 H750" class="line"/><path d="M970 689 H1035" class="line"/>
  <path d="M935 130 H1255 V220" class="dash"/>
  <text x="773" y="487" class="subtitle">always()</text><text x="990" y="636" class="subtitle">không chạy trên pull request</text>
</svg>
