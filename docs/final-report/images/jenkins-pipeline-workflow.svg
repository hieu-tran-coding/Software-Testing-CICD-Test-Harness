<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hai chế độ của Jenkins Pipeline</title>
  <desc id="desc">Nhánh source mode và image mode hội tụ tại các bước hậu xử lý báo cáo và dọn dẹp.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:15px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .head{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.body{font:14px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .start{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.source{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .image{fill:#fff7ed;stroke:#f97316;stroke-width:2}.post{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
      .decision{fill:#fefce8;stroke:#ca8a04;stroke-width:2.5}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .sourceLine{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.imageLine{stroke:#ea580c;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="43" text-anchor="middle" class="title">Jenkins Pipeline — Source mode và Image mode</text>
  <text x="800" y="69" text-anchor="middle" class="subtitle">Hai luồng thực thi dùng chung bước công bố kết quả và dọn dẹp</text>

  <g filter="url(#shadow)"><rect x="610" y="95" width="380" height="70" rx="16" class="start"/><text x="800" y="124" text-anchor="middle" class="head">Build with Parameters</text><text x="800" y="148" text-anchor="middle" class="body">Repository · revision · image · smoke configuration</text></g>
  <g filter="url(#shadow)"><path d="M800 200 L920 270 L800 340 L680 270 Z" class="decision"/><text x="800" y="264" text-anchor="middle" class="head">RUN_MODE</text><text x="800" y="288" text-anchor="middle" class="body">source / image</text></g>

  <text x="390" y="255" text-anchor="middle" class="head" fill="#1d4ed8">SOURCE MODE</text>
  <g filter="url(#shadow)"><rect x="70" y="370" width="160" height="70" rx="13" class="source"/><text x="150" y="399" text-anchor="middle" class="head">Checkout</text><text x="150" y="422" text-anchor="middle" class="body">SUT_REF</text></g>
  <g filter="url(#shadow)"><rect x="260" y="370" width="160" height="70" rx="13" class="source"/><text x="340" y="399" text-anchor="middle" class="head">Runtime</text><text x="340" y="422" text-anchor="middle" class="body">Node · npm</text></g>
  <g filter="url(#shadow)"><rect x="450" y="370" width="160" height="70" rx="13" class="source"/><text x="530" y="399" text-anchor="middle" class="head">Install</text><text x="530" y="422" text-anchor="middle" class="body">npm install</text></g>
  <g filter="url(#shadow)"><rect x="165" y="495" width="160" height="70" rx="13" class="source"/><text x="245" y="524" text-anchor="middle" class="head">Lint</text><text x="245" y="547" text-anchor="middle" class="body">ESLint</text></g>
  <g filter="url(#shadow)"><rect x="355" y="495" width="160" height="70" rx="13" class="source"/><text x="435" y="524" text-anchor="middle" class="head">Test</text><text x="435" y="547" text-anchor="middle" class="body">Mocha · JUnit</text></g>
  <g filter="url(#shadow)"><rect x="545" y="495" width="160" height="70" rx="13" class="source"/><text x="625" y="524" text-anchor="middle" class="head">Build</text><text x="625" y="547" text-anchor="middle" class="body">Next.js</text></g>

  <text x="1210" y="255" text-anchor="middle" class="head" fill="#c2410c">IMAGE MODE</text>
  <g filter="url(#shadow)"><rect x="970" y="370" width="160" height="70" rx="13" class="image"/><text x="1050" y="399" text-anchor="middle" class="head">Prepare</text><text x="1050" y="422" text-anchor="middle" class="body">Trusted workspace</text></g>
  <g filter="url(#shadow)"><rect x="1160" y="370" width="160" height="70" rx="13" class="image"/><text x="1240" y="399" text-anchor="middle" class="head">Validate</text><text x="1240" y="422" text-anchor="middle" class="body">Image · SHA</text></g>
  <g filter="url(#shadow)"><rect x="1350" y="370" width="170" height="70" rx="13" class="image"/><text x="1435" y="399" text-anchor="middle" class="head">Verify Docker</text><text x="1435" y="422" text-anchor="middle" class="body">Daemon access</text></g>
  <g filter="url(#shadow)"><rect x="875" y="495" width="160" height="70" rx="13" class="image"/><text x="955" y="524" text-anchor="middle" class="head">Pull image</text><text x="955" y="547" text-anchor="middle" class="body">GHCR credential</text></g>
  <g filter="url(#shadow)"><rect x="1065" y="495" width="160" height="70" rx="13" class="image"/><text x="1145" y="524" text-anchor="middle" class="head">Run image</text><text x="1145" y="547" text-anchor="middle" class="body">Private network</text></g>
  <g filter="url(#shadow)"><rect x="1255" y="495" width="160" height="70" rx="13" class="image"/><text x="1335" y="524" text-anchor="middle" class="head">Smoke test</text><text x="1335" y="547" text-anchor="middle" class="body">GET /api/tags</text></g>
  <g filter="url(#shadow)"><rect x="970" y="620" width="200" height="70" rx="13" class="image"/><text x="1070" y="649" text-anchor="middle" class="head">Connect runner</text><text x="1070" y="672" text-anchor="middle" class="body">Jenkins → SUT network</text></g>
  <g filter="url(#shadow)"><rect x="1215" y="620" width="200" height="70" rx="13" class="image"/><text x="1315" y="649" text-anchor="middle" class="head">Cypress UI tests</text><text x="1315" y="672" text-anchor="middle" class="body">JUnit · Allure · video</text></g>

  <g filter="url(#shadow)"><rect x="390" y="760" width="820" height="92" rx="18" class="post"/><text x="800" y="792" text-anchor="middle" class="head">POST ACTIONS — luôn thực hiện</text><text x="800" y="820" text-anchor="middle" class="body">Finalize và cleanup → Publish JUnit → Publish Allure → Archive test-reports</text><text x="800" y="842" text-anchor="middle" class="subtitle">Báo cáo và log vẫn được lưu khi một stage trước đó thất bại</text></g>

  <path d="M800 165 V200" class="line"/>
  <path d="M680 270 H150 V370" class="sourceLine"/><text x="635" y="257" class="subtitle">source</text>
  <path d="M230 405 H260" class="sourceLine"/><path d="M420 405 H450" class="sourceLine"/><path d="M530 440 V465 H245 V495" class="sourceLine"/><path d="M325 530 H355" class="sourceLine"/><path d="M515 530 H545" class="sourceLine"/>
  <path d="M920 270 H1050 V370" class="imageLine"/><text x="940" y="257" class="subtitle">image</text>
  <path d="M1130 405 H1160" class="imageLine"/><path d="M1320 405 H1350" class="imageLine"/>
  <path d="M1435 440 V465 H955 V495" class="imageLine"/><path d="M1035 530 H1065" class="imageLine"/><path d="M1225 530 H1255" class="imageLine"/>
  <path d="M1335 565 V592 H1070 V620" class="imageLine"/><path d="M1170 655 H1215" class="imageLine"/>
  <path d="M625 565 V715 H650 V760" class="sourceLine"/><path d="M1315 690 V715 H950 V760" class="imageLine"/>
</svg>
